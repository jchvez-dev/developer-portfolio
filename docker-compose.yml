networks:
  portafolio-network:
    driver: bridge

volumes:
  minio-data:

services:
  storage:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: portafolio-storage
    ports:
      - "${MINIO_API_PORT}:9000"     # API S3 (PC:Contenedor)
      - "${MINIO_CONSOLE_PORT}:9001" # Panel web (PC:Contenedor)
    volumes:
      - minio-data:/data
    networks:
      - portafolio-network
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}

  storage-init:
    image: minio/mc:latest
    container_name: portafolio-storage-init
    depends_on:
      - storage
    networks:
      - portafolio-network
    entrypoint: |
      /bin/sh -c "
      until /usr/bin/mc alias set local_cluster http://storage:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do 
        echo 'Waiting for MinIO server...'; 
        sleep 1; 
      done;
      /usr/bin/mc mb --ignore-existing local_cluster/system-assets;
      /usr/bin/mc mb --ignore-existing local_cluster/user-uploads;
      /usr/bin/mc mb --ignore-existing local_cluster/production-exports;
      /usr/bin/mc mb --ignore-existing local_cluster/chat-history;
      /usr/bin/mc mb --ignore-existing local_cluster/contact-messages;
      /usr/bin/mc anonymous set public local_cluster/production-exports;
      echo 'All buckets provisioned successfully!';
      exit 0;
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: portafolio-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - portafolio-network
    environment:
      - NODE_ENV=${NODE_ENV}
    depends_on:
      - backend-nest

  backend-nest:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile.dev
    container_name: portafolio-nest
    ports:
      - "${NEST_PORT}:4000"
    volumes:
      - ./backend-nest:/app
      - /app/node_modules
    networks:
      - portafolio-network
    environment:
      - NODE_ENV=${NODE_ENV}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - NEST_PORT=4000
      - FRONTEND_PORT=${FRONTEND_PORT}
      - MINIO_API_PORT=${MINIO_API_PORT}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - PHP_BACKEND_URL=${PHP_BACKEND_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MINIO_ENDPOINT=storage
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-juan@example.com}
    depends_on:
      - storage
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    container_name: portafolio-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - portafolio-network

  backend-php:
    build:
      context: ./backend-php
      dockerfile: Dockerfile.dev
    container_name: portafolio-php
    volumes:
      - ./backend-php:/app
      - /app/vendor
    networks:
      - portafolio-network
    environment:
      - MINIO_ENDPOINT=http://storage:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      - storage
