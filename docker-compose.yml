networks:
  portafolio-network:
    driver: bridge

volumes:
  minio-data:
  pnpm-store:

services:
  storage:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: portafolio-storage
    ports:
      - "${BUCKET_API_PORT:-9000}:9000"     # API S3 (PC:Contenedor)
      - "${BUCKET_CONSOLE_PORT:-9001}:9001" # Panel web (PC:Contenedor)
    volumes:
      - minio-data:/data
    networks:
      - portafolio-network
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${BUCKET_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${BUCKET_SECRET_ACCESS_KEY}

  storage-init:
    image: minio/mc:latest
    container_name: portafolio-storage-init
    depends_on:
      - storage
    networks:
      - portafolio-network
    volumes:
      - ./backend-php/fonts:/fonts
    entrypoint: |
      /bin/sh -c "
      until /usr/bin/mc alias set local_cluster http://storage:9000 ${BUCKET_ACCESS_KEY_ID} ${BUCKET_SECRET_ACCESS_KEY}; do
        echo 'Waiting for MinIO server...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing local_cluster/system-assets;
      /usr/bin/mc mb --ignore-existing local_cluster/user-uploads;
      /usr/bin/mc mb --ignore-existing local_cluster/production-exports;
      /usr/bin/mc mb --ignore-existing local_cluster/chat-history;
      /usr/bin/mc mb --ignore-existing local_cluster/contact-messages;
      for f in /fonts/*.ttf; do /usr/bin/mc cp "$$f" local_cluster/system-assets/fonts/; done;
      echo 'All buckets provisioned successfully!';
      exit 0;
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: portafolio-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - pnpm-store:/pnpm/store
    networks:
      - portafolio-network
    environment:
      - NODE_ENV=${NODE_ENV}
    depends_on:
      - backend-nest

  backend-nest:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile.dev
    container_name: portafolio-nest
    ports:
      - "${NEST_PORT}:4000"
    volumes:
      - ./backend-nest:/app
      - /app/node_modules
      - pnpm-store:/pnpm/store
    networks:
      - portafolio-network
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEST_PORT=4000
      - FRONTEND_PORT=${FRONTEND_PORT}
      - BUCKET_ENDPOINT=${BUCKET_ENDPOINT:-http://storage:9000}
      - BUCKET_ACCESS_KEY_ID=${BUCKET_ACCESS_KEY_ID}
      - BUCKET_SECRET_ACCESS_KEY=${BUCKET_SECRET_ACCESS_KEY}
      - BUCKET_REGION=${BUCKET_REGION:-us-east-1}
      - PHP_BACKEND_URL=${PHP_BACKEND_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-juan@example.com}
    depends_on:
      - storage
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    container_name: portafolio-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - portafolio-network

  backend-php:
    build:
      context: ./backend-php
      dockerfile: Dockerfile.dev
    container_name: portafolio-php
    volumes:
      - ./backend-php:/app
      - /app/vendor
    networks:
      - portafolio-network
    environment:
      - BUCKET_ENDPOINT=${BUCKET_ENDPOINT:-http://storage:9000}
      - BUCKET_ACCESS_KEY_ID=${BUCKET_ACCESS_KEY_ID}
      - BUCKET_SECRET_ACCESS_KEY=${BUCKET_SECRET_ACCESS_KEY}
      - BUCKET_REGION=${BUCKET_REGION:-us-east-1}
    depends_on:
      - storage
