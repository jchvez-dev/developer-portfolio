version: '3.8'

networks:
  portafolio-network:
    driver: bridge

volumes:
  minio-data:

services:
  storage:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: portafolio-storage
    ports:
      - "${MINIO_API_PORT}:9000"     # API S3
      - "${MINIO_CONSOLE_PORT}:9001" # Panel web
    volumes:
      - minio-data:/data
    networks:
      - portafolio-network
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}